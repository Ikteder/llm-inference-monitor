[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-monitor"
version = "0.1.0"
description = "Zero-dependency monitor for a local LLM inference stack: speed, cache economics, VRAM headroom, guarded model switching."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ikteder" }]
keywords = ["llm", "inference", "monitoring", "llama.cpp", "llama-swap", "vram", "prompt-cache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

# No runtime dependencies at all: the reader, the derived metrics and the panel renderer are stdlib only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Ikteder/llm-inference-monitor"
Issues = "https://github.com/Ikteder/llm-inference-monitor/issues"

[project.scripts]
inference-monitor = "monitor.dashboard:main"

[tool.setuptools.packages.find]
include = ["monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
